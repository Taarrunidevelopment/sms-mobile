name: sunrise_school_app
description: "Sunrise Public School - Complete School Management Flutter Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.0.1

  # Models & JSON
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # UI, Icons, Typography & Motion
  flutter_animate: ^4.5.0
  pinput: ^5.0.0
  flutter_slidable: ^3.1.0
  gap: ^3.0.1
  collection: ^1.18.0
  intl: ^0.19.0

  # Storage & Utilities
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  file_picker: ^8.0.0

  # Networking
  dio: ^5.7.0
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^5.1.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/sample_files/
    - assets/images/
